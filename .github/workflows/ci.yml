name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore local tools
        run: dotnet tool restore

      - name: Restore dependencies
        run: dotnet restore OnlineStore.slnx

      - name: Build
        run: dotnet build OnlineStore.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test OnlineStore.slnx --configuration Release --no-build --no-restore
