<body class="bg-background min-h-screen flex text-on-surface font-body-md text-body-md antialiased selection:bg-secondary-fixed selection:text-on-secondary-fixed">
<!-- Transactional Page: Navigation Shell is suppressed. -->
<main class="flex-1 flex flex-col md:flex-row w-full min-h-screen">
<!-- Left Side: Promotional Image -->
<div class="hidden md:flex md:w-1/2 relative bg-surface-container-high overflow-hidden" data-alt="A high-quality lifestyle image showing a modern, minimalist living space with stylish home goods. Soft, natural sunlight streams through large windows, highlighting clean lines and neutral tones. The aesthetic is premium, calming, and aspirational, fitting for a sophisticated e-commerce brand." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuBDMCwQ6VyPBxkemwvL7b0Ka1l1h11aJ-m1jiI95c-MXNwyYp2cB0ur1X0TtsGrUZLpMHFMI3kUGOV-MXWmAbq09moU_hT2s0Caiq5BCtEzZsSOjOYqaToTs9vVC35YByldZHgcHA5FI9VCO5pCK6jbpHM3ZYNEPBoZmBd8tMtKKy_AaWpTSd2DSiomVLOFdnkf2vq5ZZz-KkmdXlf0ZPTqomxwyU52nuCz6CWHjEbFwWoemPzH1QkpQw')">
<!-- Overlay for text readability if needed in the future -->
<div class="absolute inset-0 bg-primary/10"></div>
</div>
<!-- Right Side: Login Form -->
<div class="flex-1 flex items-center justify-center p-margin-mobile md:p-gutter bg-surface-container-lowest">
<div class="w-full max-w-md bg-surface-container-lowest rounded-xl shadow-sm p-8 flex flex-col gap-stack-lg relative z-10 transition-transform duration-300 hover:shadow-md hover:-translate-y-1">
<!-- Brand / Header -->
<div class="text-center flex flex-col gap-stack-sm items-center">
<span class="material-symbols-outlined text-headline-lg text-primary mb-2">shopping_bag</span>
<h1 class="font-headline-lg text-headline-lg text-primary">Welcome Back</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant">Please enter your details to sign in.</p>
</div>
<!-- Form -->
<form action="#" class="flex flex-col gap-stack-md w-full" method="POST">
<!-- Email Field -->
<div class="flex flex-col gap-stack-sm">
<label class="font-label-md text-label-md text-on-surface" for="email">Email</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant text-body-md">mail</span>
<input class="w-full pl-10 pr-4 py-3 bg-surface-container-lowest border border-outline-variant rounded-lg font-body-sm text-body-sm text-on-surface placeholder:text-on-surface-variant/50 focus:border-[#64B5F6] focus:ring-0 focus:shadow-[0_0_0_4px_rgba(100,181,246,0.25)] transition-all outline-none" id="email" name="email" placeholder="name@example.com" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-stack-sm">
<div class="flex justify-between items-center">
<label class="font-label-md text-label-md text-on-surface" for="password">Password</label>
<a class="font-label-md text-label-md text-secondary hover:text-on-secondary-container transition-colors" href="#">Forgot Password?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant text-body-md">lock</span>
<input class="w-full pl-10 pr-10 py-3 bg-surface-container-lowest border border-outline-variant rounded-lg font-body-sm text-body-sm text-on-surface placeholder:text-on-surface-variant/50 focus:border-[#64B5F6] focus:ring-0 focus:shadow-[0_0_0_4px_rgba(100,181,246,0.25)] transition-all outline-none" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-on-surface transition-colors focus:outline-none" type="button">
<span class="material-symbols-outlined text-body-md">visibility_off</span>
</button>
</div>
</div>
<!-- Remember Me -->
<div class="flex items-center gap-2 mt-2">
<input class="w-4 h-4 rounded border-outline-variant text-[#007BFF] focus:ring-[#007BFF] bg-surface-container-lowest cursor-pointer transition-colors" id="remember" name="remember" type="checkbox"/>
<label class="font-body-sm text-body-sm text-on-surface cursor-pointer select-none" for="remember">Remember me</label>
</div>
<!-- Actions -->
<div class="flex flex-col gap-stack-sm mt-4">
<button class="w-full py-3 bg-[#007BFF] text-[#FFFFFF] font-label-md text-label-md rounded-lg shadow-sm hover:shadow-md hover:-translate-y-0.5 transition-all active:scale-[0.98] focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-[#007BFF]" type="submit">
                            Login
                        </button>
</div>
</form>
<!-- Footer CTA -->
<div class="text-center mt-2">
<p class="font-body-sm text-body-sm text-on-surface-variant">
                        Don't have an account? 
                        <a class="font-label-md text-label-md text-[#0A192F] hover:text-[#007BFF] transition-colors" href="#">Register</a>
</p>
</div>
</div>
</div>
</main>
</body></html>
