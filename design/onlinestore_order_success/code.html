<body class="bg-background min-h-screen flex flex-col font-body-md text-on-background">
<!-- Navbar Suppressed because this is a transactional success screen -->
<!-- Main Content Canvas -->
<main class="flex-grow flex items-center justify-center py-section-padding px-margin-mobile md:px-gutter">
<div class="max-w-xl w-full bg-surface-container-lowest rounded-xl shadow-sm border border-outline-variant p-section-padding text-center">

<span class="material-symbols-outlined text-5xl text-secondary" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<div class="absolute inset-0 rounded-full border-4 border-secondary opacity-20 scale-110 animate-ping"></div>
</div>
<!-- Title -->
<h1 class="font-headline-lg text-headline-lg text-on-surface mb-stack-sm">Order Placed Successfully!</h1>
<p class="font-body-md text-body-md text-on-surface-variant mb-stack-lg">Thank you for your purchase. We've sent a confirmation email with your order details.</p>
<!-- Order Details Bento Card -->
<div class="bg-surface-container-low rounded-lg p-stack-md text-left mb-stack-lg border border-outline-variant/50">
<div class="grid grid-cols-2 gap-stack-md">
<div>
<span class="block font-label-md text-label-md text-on-surface-variant mb-1 uppercase">Order Number</span>
<span class="font-body-md text-body-md font-semibold text-on-surface">#ORD-8293</span>
</div>
<div>
<span class="block font-label-md text-label-md text-on-surface-variant mb-1 uppercase">Date</span>
<span class="font-body-md text-body-md font-semibold text-on-surface">Oct 12, 2024</span>
</div>
<div>
<span class="block font-label-md text-label-md text-on-surface-variant mb-1 uppercase">Total</span>
<span class="font-price-lg text-price-lg text-on-surface">$245.00</span>
</div>
<div>
<span class="block font-label-md text-label-md text-on-surface-variant mb-1 uppercase">Est. Delivery</span>
<span class="font-body-md text-body-md font-semibold text-on-surface">Oct 24, 2024</span>
</div>
</div>
</div>
<!-- Action Buttons -->
<div class="flex flex-col sm:flex-row justify-center gap-stack-md">
<button class="bg-primary hover:bg-primary/90 text-on-primary font-body-md text-body-md font-semibold py-3 px-8 rounded-lg transition-colors shadow-sm">
                    View Order
                </button>
<button class="bg-surface-container-lowest border-2 border-primary hover:bg-surface-container-high text-primary font-body-md text-body-md font-semibold py-3 px-8 rounded-lg transition-colors">
